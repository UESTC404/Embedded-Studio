media:
  - name: images
    label: 图片库
    input: public/images
    output: /images
    rename: safe
    categories: [image]
  - name: documents
    label: 文件库
    input: public/files
    output: /files
    rename: safe
    categories: [document]

content:
  - name: docs
    label: 网站文档
    type: collection
    path: content/docs
    format: yaml-frontmatter
    exclude: [meta.json]
    filename: "{primary}.md"
    view:
      fields: [title, description]
      primary: title
      sort: [title]
    operations:
      create: true
      rename: false
      delete: false
    fields:
      - name: title
        label: 页面标题
        type: string
        required: true
      - name: description
        label: 页面简介
        type: text
        required: true
      - name: slug
        label: 页面子链接
        type: string
        required: false
        description: 可选。填写英文路径，例如 toolbox；留空时沿用文件名。修改后旧链接及该页评论映射会随之变化。
      - name: body
        label: 页面正文
        type: rich-text
        description: 连续插入两张及以上图片会自动排成两列画廊，手机端自动变为单列，点击图片可查看原图。单张图片可在源码模式给地址末尾添加 #small、#medium、#large 或 #wide 调整尺寸；PDF 等附件请先上传到“文件库”，再于源码模式插入文件链接。
        options:
          format: markdown
          media: images
          switcher: true
          categories: [image]
          rename: safe

  - name: navigation
    label: 左侧导航
    type: file
    path: content/navigation.json
    format: json
    fields:
      - name: title
        label: 导航总标题
        type: string
        required: true
      - name: items
        label: 页面顺序与分类
        type: block
        list: true
        required: true
        description: 拖动条目可调整顺序。文档项会自动显示网站文档的真实标题；标题内容请回到对应文档中修改。
        blockKey: type
        blocks:
          - name: page
            label: 文档
            fields:
              - name: page
                label: 选择文档
                type: reference
                required: true
                options:
                  collection: docs
                  search: title,description
                  value: "{name}"
                  label: "{primary}"
          - name: category
            label: 分类标题
            fields:
              - name: label
                label: 分类名称
                type: string
                required: true
          - name: unlisted
            label: 自动加入未列出页面
            fields:
              - name: note
                label: false
                type: string
                hidden: true

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      update: "content: 更新 {path}"
